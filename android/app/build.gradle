plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vega.rccar'
    compileSdk 37

    // Only Build Tools 36.0.0 is installed on this machine. Without this line
    // AGP resolves a default (34.0.0) that is not present, and the build dies
    // with "Failed to find Build Tools revision 34.0.0" *after* printing
    // BUILD SUCCESSFUL -- producing no APK. Pin it explicitly.
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.vega.rccar"
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
